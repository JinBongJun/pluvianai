# Pytest config for GitHub Actions (see .github/workflows/ci.yml).
# Scope: unit tests only. Several integration modules and some unit files still
# expect disabled routes or older models — re-expand testpaths as tests are aligned.
# Still ignored: alert/billing/lifecycle/onboarding (deferred / env-specific).
[pytest]
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -q
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=xml
    --ignore=tests/unit/test_alert_service.py
    --ignore=tests/unit/test_billing_service.py
    --ignore=tests/unit/test_data_lifecycle_service.py
    --ignore=tests/unit/test_onboarding_service.py
filterwarnings =
    ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning:sentry_sdk.integrations.starlette
    ignore:'BaseCommand' is deprecated and will be removed in Click 9.0.*:DeprecationWarning:typer.completion
    ignore:Importing 'parser.split_arg_string' is deprecated.*:DeprecationWarning:spacy.cli._util
    ignore:Importing 'parser.split_arg_string' is deprecated.*:DeprecationWarning:weasel.util.config
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
